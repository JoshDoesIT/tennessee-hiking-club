version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # ESLint 10 is blocked until eslint-plugin-react ships a fix for the
      # removed context.getFilename(). See #36. (TypeScript 6 is adopted.)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is blocked until typescript-eslint widens its peer range
      # past <6.1.0. On TS 7, typescript-estree throws at load
      # ("Cannot read properties of undefined (reading 'Cjs')") and `pnpm lint`
      # dies before linting a single file. Only 8.68.1-alpha.* has support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
