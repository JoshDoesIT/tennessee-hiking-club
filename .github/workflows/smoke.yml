name: Smoke

# Production smoke suite against the live deploy. Runs daily and on demand,
# so a Vercel rollout that broke a critical path gets caught even if no PR
# is open.

on:
  schedule:
    # 12:00 UTC daily (~07:00 ET).
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "SMOKE_BASE_URL override (default https://www.tnhiking.club)"
        required: false
        default: "https://www.tnhiking.club"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests against production
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url || 'https://www.tnhiking.club' }}
        run: pnpm test:smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-playwright-report
          path: playwright-report/
          retention-days: 14
